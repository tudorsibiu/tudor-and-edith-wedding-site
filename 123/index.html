    <style>
      body {
        font-family: 'Montserrat', sans-serif; /* Primary body font */
        background-color: #FDFBF7; /* Soft Cream/Linen */
        color: #3D403A; /* Deep Forest Green/Charcoal */
      }

      /* Custom font classes for the new theme */
      .font-display {
        font-family: 'Cormorant Garamond', serif;
      }
      .font-body {
        font-family: 'Montserrat', sans-serif;
      }
      
      /* --- ANIMATION STYLES --- */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); } /* Softer bounce */
        60% { transform: translateY(-5px); } /* Softer bounce */
      }

      @keyframes heartbeat {
        0% { transform: scale(1); }
        15% { transform: scale(1.08); } /* Softer pulse */
        30% { transform: scale(1); }
        45% { transform: scale(1.08); } /* Softer pulse */
        60% { transform: scale(1); }
        100% { transform: scale(1); }
      }

      /* Initial animation on page load for Hero elements */
      .animate-load {
        opacity: 0;
        animation: fadeInUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      /* Base state for elements animated on scroll */
      .anim-target {
        opacity: 0;
        transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      }

      /* Animation trigger for scroll-based animations */
      .is-visible .anim-fade-up {
        opacity: 1;
        transform: translateY(0);
      }
      .is-visible .anim-left {
        opacity: 1;
        transform: translateX(0);
      }
      .is-visible .anim-right {
        opacity: 1;
        transform: translateX(0);
      }
      
      .anim-fade-up { transform: translateY(40px); } /* Softer translate */
      .anim-left { transform: translateX(-40px); } /* Softer translate */
      .anim-right { transform: translateX(40px); } /* Softer translate */


      /* Staggered animation delays */
      .is-visible .anim-stagger:nth-child(1) { transition-delay: 0ms; }
      .is-visible .anim-stagger:nth-child(2) { transition-delay: 100ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(3) { transition-delay: 200ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(4) { transition-delay: 300ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(5) { transition-delay: 400ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(6) { transition-delay: 500ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(7) { transition-delay: 600ms; } /* Reduced delay */
      .is-visible .anim-stagger:nth-child(8) { transition-delay: 700ms; } /* Reduced delay */
